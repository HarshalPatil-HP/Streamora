<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Streamora — Watch, upload and connect with creators on the modern streaming platform." />
    <meta property="og:title" content="Streamora" />
    <meta property="og:description" content="Watch, upload and connect with creators." />
    <meta property="og:type" content="website" />
    <title>Streamora</title>

    <!-- Favicon — SVG with the Streamora S-wave mark -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0A0A'/%3E%3Cpolygon points='8,6 24,16 8,26' fill='white'/%3E%3C/svg%3E" />
    <link rel="alternate icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAMAAABEpIrGAAAAA1BMVEUKCgqjwUC0AAAADklEQVR42mNkYGBgAAAABAABJzQnCgAAAABJRU5ErkJggg==" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230A0A0A'/%3E%3Cpolygon points='45,36 135,90 45,144' fill='white'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      #splash-screen {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background-color: #0A0A0A;
        transition: opacity 700ms;
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.95); opacity: 0.8; }
      }
      @keyframes splashFadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .splash-logo {
        animation: splashPulse 2s ease-in-out infinite;
      }
      .splash-text {
        opacity: 0;
        animation: splashFadeIn 1s ease-out 0.3s forwards;
      }
    </style>
  </head>
  <body class="h-full antialiased overflow-hidden">
    <!-- Intro / Loading Screen -->
    <div id="splash-screen" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-[#0A0A0A] transition-opacity duration-700">
      <div class="flex flex-col items-center gap-5 translate-y-[-10%]" style="display: flex; flex-direction: column; align-items: center; gap: 1.25rem; transform: translateY(-10%);">
        <!-- Logo Icon with custom glow/scale animation -->
        <div class="splash-logo relative flex h-20 w-20 items-center justify-center rounded-2xl overflow-hidden"
             style="background: linear-gradient(135deg, #ffffff 0%, #d4d4d4 100%); box-shadow: 0 0 40px rgba(255,255,255,0.1); width: 5rem; height: 5rem; border-radius: 1rem; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="40" height="40" fill="none">
            <polygon points="5,3 17,10 5,17" fill="#0A0A0A"/>
          </svg>
        </div>
        <!-- Wordmark -->
        <div class="splash-text flex flex-col items-center gap-1.5" style="display: flex; flex-direction: column; align-items: center; gap: 0.375rem;">
          <div class="flex items-baseline gap-0.5" style="display: flex; align-items: baseline; gap: 0.125rem;">
            <span class="text-[28px] font-extrabold tracking-tight text-white leading-none" style="font-size: 28px; font-weight: 800; letter-spacing: -0.025em; color: white; line-height: 1;">Stream</span>
            <span class="text-[28px] font-extrabold tracking-tight text-[#777] leading-none" style="font-size: 28px; font-weight: 800; letter-spacing: -0.025em; color: #777; line-height: 1;">ora</span>
          </div>
          <p class="text-[11px] font-bold uppercase tracking-[0.3em] text-[#555]" style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3em; color: #555; margin: 0;">Watch &amp; Connect</p>
        </div>
      </div>
    </div>

    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
